# SD Core for Linux Solo (LSOLO 3): this file names NO PATH.  SDSYS, USRDIR
# and GRPDIR default to <home> itself, <home>/user_accounts and
# <home>/group_accounts, where <home> is the folder above the directory that
# holds the running sd (gplsrc/inipath.c GetHomePath).  A line here still
# overrides.  DUMPDIR was <sdsys>/dumps; it is unset until LSOLO 9 decides
# whether the installer creates that directory.
[sd]
GRPSIZE=2
NUMUSERS=20
SORTMEM=4096
ERRLOG=50
