# SD Core Solo for Linux: this file names no path, so the Solo folder can be
# moved.  SDSYS, USRDIR and GRPDIR default to the Solo folder itself, its
# user_accounts and its group_accounts.  DUMPDIR is not set, so a process dump
# is written in the Solo folder.  A line here overrides any of them.
[sd]
SCREENTHEME=paper
GRPSIZE=4
NUMUSERS=20
SORTMEM=4096
ERRLOG=50
